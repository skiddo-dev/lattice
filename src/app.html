<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="Lattice — a local-first AI control plane: route local ↔ cloud and watch your rig live." />
  <meta name="theme-color" content="#6366f1" />

  <!-- Resolve the theme BEFORE first paint so there's no light flash, then set
       <html data-theme> + the theme-color tint. Mirrors src/lib/theme.ts; the
       reactive store re-syncs on mount (initTheme in +layout.svelte). -->
  <script>
    (function () {
      try {
        var p = localStorage.getItem('lattice:theme') || 'system';
        var dark = p === 'dark' || (p === 'system' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', dark ? '#0b1220' : '#6366f1');
      } catch (e) {}
    })();
  </script>
  %sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
  <div style="display: contents">%sveltekit.body%</div>
</body>
</html>
